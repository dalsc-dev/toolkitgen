name: CI Pipeline

on:
  push:
    branches: [main, 'migration/*']
  pull_request:
    branches: [main]

# Concurrency control: cancel redundant in-flight builds on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Test, Check Limits & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm Store Directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Corporate Copy Standards
        run: pnpm run check:copy

      - name: Typecheck TypeScript (Strict)
        run: pnpm exec tsc --noEmit

      - name: Run Vitest Unit Tests
        run: pnpm test

      - name: Static Site Build & Free-Tier Quota Check
        run: pnpm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1
